<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="/static/main.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add review - Game review application</title>
</head>
<body>
    <div class="header">
        <h1>Game review application</h1>
    </div>
    <nav>
        <ul>
            <li><a href="/">Front page</a></li>
            <li><a href="/profile/{{ session.username }}">Profile</a></li>
            <li><a href="/games">Games</a></li>
            <li><a href="/add_game">Add game</a></li>
            <li><a href="/logout">Logout</a></li>
        </ul>
    </nav>
    <h1>Add review</h1>
    <div class="container">
        <form action="/game/{{ id }}/add_review" method="post">
            <input type="text" name="title" placeholder="Title">
            <textarea name="review" class="textarea" placeholder="Review"></textarea>
            <input type="text" name="rating" placeholder="Grade 1-10">
            <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
            <input type="submit" class="button" value="Add review">
        </form>
</html>
