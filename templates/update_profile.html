<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="/static/main.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change profile - Game review application</title>
</head>
    <body>
        <div class="header">
            <h1>Game review application</h1>
        </div>
        <nav>
            <ul>
                <li><a href="/">Front page</a></li>
                <li><a href="/profile/{{ session.username }}">Profile</a></li>
                <li><a href="/games">Games</a></li>
                <li><a href="/add_game">Add game</a></li>
                <li><a href="/logout">Logout</a></li>
            </ul>
        </nav>
        <h1>Change profile</h1>
        <div class="container">
            <form action="/update_profile" method="post">
                <textarea name="bio" class="textarea" placeholder="Biography"></textarea>
                <input type="text" name="fav_games" placeholder="Favorite game">
                <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
                <input type="submit" class="button" value="Update profile">
        </div>
        </form>
    </body>
</html>
